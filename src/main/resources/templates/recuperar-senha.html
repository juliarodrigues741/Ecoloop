<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recuperar Senha - Ecoloop</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card card">
    <h2>Recuperar Senha</h2>

    <!-- Mensagens -->
    <div th:if="${erro}" style="color:red;font-size:14px;margin-bottom:10px" th:text="${erro}"></div>
    <div th:if="${sucesso}" id="msg-sucesso" style="color:green;font-size:14px;margin-bottom:10px" th:text="${sucesso}"></div>

    <form action="/recuperar-senha" method="post" th:if="${usuario == null || usuario != null}">
      <!-- Se usuário ainda não validado, mostra o campo de e-mail -->
      <div th:if="${usuario == null}">
        <input class="input" type="email" name="email" placeholder="Seu e-mail" required>
        <button class="btn" type="submit">Enviar</button>
      </div>

      <!-- Se usuário existe, mostra campo de nova senha -->
      <div th:if="${usuario != null}">
        <input class="input" type="email" name="email" th:value="${usuario.email}" readonly
               style="background:#e9e9e9;cursor:not-allowed">
        <input class="input" type="password" name="senhaNova" placeholder="Nova senha" required>
        <button class="btn" type="submit">Alterar Senha</button>
      </div>
    </form>

    <div style="margin-top:10px">
      <a href="/login" style="font-size:13px;color:rgba(6,58,42,0.8)">Voltar ao login</a>
    </div>
  </div>
</div>

<!-- Redireciona automaticamente para o login após 2 segundos -->
<script th:if="${sucesso}">
  setTimeout(function() {
    window.location.href = '/login';
  }, 2000);
</script>

</body>
</html>
