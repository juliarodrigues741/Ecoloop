<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Dashboard - EcoLoop</title>
    <link rel="stylesheet" href="/dashboard.css" />
</head>

<body>
<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo-row">
            <div class="logo-circle"></div>
            <span class="logo-text">EcoLoop</span>
        </div>

        <nav class="nav">
            <a class="nav-item active" href="/dashboard">Home</a>
            <a class="nav-item" href="/enviar">Enviar</a>
            <a class="nav-item" href="/beneficios">Benefícios</a>
            <a class="nav-item" href="/conquistas">Conquistas</a>
            <a class="nav-item" href="/perfil">Perfil</a>
            <a class="nav-item" href="/configuracoes">Configurações</a>
            <a class="nav-item" href="/uploads">Uploads</a>
            <a class="nav-item logout" href="/logout">Sair</a>
        </nav>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main">

        <!-- HEADER -->
        <header class="page-header">
            <h1>Dashboard</h1>
            <p>
                Bem-vindo de volta,
                <span th:text="${usuario.email}"></span>! 👋
            </p>
        </header>

        <!-- CARDS SUPERIORES -->
        <section class="summary-row">

            <article class="summary-card">
                <p class="summary-label">Pontos Totais</p>
                <p class="summary-value" th:text="${usuario.pontos}">0</p>
            </article>

            <article class="summary-card">
                <p class="summary-label">Nível</p>
                <p class="summary-value" th:text="${usuario.nivel}">0</p>
            </article>

        </section>

        <!-- GRID PRINCIPAL -->
        <section class="content-grid">

            <!-- ESQUERDA -->
            <div class="left-col">

                <!-- DESAFIOS ATIVOS -->
                <article class="card challenges-card">
                    <h2>Desafios Ativos</h2>

                    <div class="challenge" th:each="ud : ${desafios}">

                        <div class="challenge-header">
                            <span th:text="${ud.desafio.titulo}">Título</span>
							<span class="challenge-points"
							      th:text="${ud.desafio != null ? ('+' + ud.desafio.pontosRecompensa + ' pts') : '+0 pts'}">
							</span>
                        </div>

                        <div class="progress-bar">
                            <div class="progress-fill"
                                 th:style="'width:' + ud.progresso + '%'">
                            </div>
                        </div>

                        <span class="progress-text"
                              th:text="${ud.progresso} + '% completo'"></span>

                    </div>
                </article>

                <!-- ATIVIDADES RECENTES -->
                <article class="card activity-card">
                    <h2>Atividades Recentes</h2>

                    <div class="activity-item" th:each="a : ${notificacoes}">

                        <div>
                            <p class="activity-title" th:text="${a.tipo}">Tipo</p>
                            <p class="activity-sub" th:text="${a.mensagem}">Mensagem</p>
                        </div>

                        <div class="activity-right">
                            <span class="activity-points"
                                  th:text="${a.pontos > 0 ? '+' + a.pontos : a.pontos}">
                                0
                            </span>

                            <span class="activity-time"
                                  th:text="${#temporals.format(a.dataEnvio, 'dd/MM/yyyy HH:mm')}">
                                data
                            </span>
                        </div>

                    </div>

                </article>

            </div>

            <!-- DIREITA -->
            <div class="right-col">

                <!-- AÇÕES RÁPIDAS -->
                <article class="quick-actions">
                    <h2>Ações Rápidas</h2>

                    <button class="quick-btn primary"
                            onclick="window.location='/enviar'">
                        📸 Enviar Material
                    </button>

                    <button class="quick-btn"
                            onclick="window.location='/beneficios'">
                        🎁 Ver Recompensas
                    </button>

                    <button class="quick-btn"
                            onclick="window.location='/conquistas'">
                        🏅 Minhas Conquistas
                    </button>
                </article>

                <!-- BENEFÍCIOS -->
                <article class="card discounts-card">
                    <h2>Descontos Disponíveis</h2>

                    <div class="discount-item" th:each="b : ${beneficios}">
                        <div>
                            <p class="discount-name" th:text="${b.nome}">Benefício</p>
                            <p class="discount-sub" th:text="${b.descricao}">Descrição</p>
                        </div>

                        <div class="discount-right">
                            <span class="discount-points"
                                  th:text="${b.pontosNecessarios}">
                                0
                            </span>
                        </div>
                    </div>

                </article>

            </div>

        </section>

    </main>
</div>

</body>
</html>
