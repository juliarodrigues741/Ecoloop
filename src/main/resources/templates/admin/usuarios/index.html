<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Usuários - Admin</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">
        <div class="brand">
            <div class="logo">E</div>
            <h1>Ecoloop Admin</h1>
        </div>

        <nav class="menu">
            <a th:href="@{/admin}">Início</a>
            <a th:href="@{/admin/beneficios}">Benefícios</a>
            <a th:href="@{/admin/conquistas}">Conquistas</a>
            <a class="active" th:href="@{/admin/usuarios}">Usuários</a>
            <a th:href="@{/admin/uploads}">Envios</a>
            <a th:href="@{/logout}">Sair</a>
        </nav>
    </aside>

    <main class="content">

        <div class="header-row">
            <h2>Usuários cadastrados</h2>
            <a class="btn" th:href="@{/admin/usuarios/novo}">Novo Usuário</a>
        </div>

        <div class="card">
            <table style="width:100%">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Foto</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Pontos</th>
                    <th>Role</th>
                    <th>Ações</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="u : ${lista}">
                    <td th:text="${u.id}"></td>

                    <!-- FOTO DO USUÁRIO (se houver) -->
                    <td>
                        <img th:if="${u.fotoPerfil != null}"
                             th:src="${u.fotoPerfil}"
                             style="width:45px; height:45px; border-radius:50%; object-fit:cover;">
                        <span th:if="${u.fotoPerfil == null}">—</span>
                    </td>

                    <td th:text="${u.nome}"></td>
                    <td th:text="${u.email}"></td>
                    <td th:text="${u.pontos}"></td>
                    <td th:text="${u.role}"></td>

                    <td>
                        <a class="btn-outline" th:href="@{'/admin/usuarios/editar/' + ${u.id}}">
                            Editar
                        </a>

                        <form th:action="@{/admin/usuarios/deletar}" method="post"
                              style="display:inline;">
                            <input type="hidden" name="id" th:value="${u.id}">
                            <button class="btn-outline" style="border-color:#c00;color:#c00;">
                                Excluir
                            </button>
                        </form>

                        <a class="btn-outline" th:href="@{'/admin/usuarios/' + ${u.id} + '/conquistas'}">
                            Conquistas
                        </a>
                    </td>
                </tr>
                </tbody>

            </table>
        </div>

    </main>

</div>

</body>
</html>
