<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Usuário - Form</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="logo">E</div>
      <h1>Ecoloop Admin</h1>
    </div>

    <nav class="menu">
      <a th:href="@{/admin}">Início</a>
      <a th:href="@{/admin/beneficios}">Benefícios</a>
      <a th:href="@{/admin/conquistas}">Conquistas</a>
      <a class="active" th:href="@{/admin/usuarios}">Usuários</a>
      <a th:href="@{/admin/uploads}">Envios</a>
      <a th:href="@{/dashboard}">Voltar ao usuário</a>
      <a th:href="@{/logout}">Sair</a>
    </nav>
  </aside>

  <main class="content">

    <h2 th:text="${usuario.id == null ? 'Novo Usuário' : 'Editar Usuário'}"></h2>

    <form class="card" th:action="@{/admin/usuarios/salvar}" method="post" th:object="${usuario}">
      <input type="hidden" th:field="*{id}">

      <label>Nome:</label>
      <input class="input" th:field="*{nome}" required>

      <label>Email:</label>
      <input class="input" th:field="*{email}" required>

      <label>Senha (hash):</label>
      <input class="input" th:field="*{senhaHash}" required>

      <label>Pontos:</label>
      <input class="input" type="number" th:field="*{pontos}" required>

      <label>Role (USER / ADMIN):</label>
      <input class="input" th:field="*{role}" required>

      <div class="footer-actions">
        <button class="btn">Salvar</button>
      </div>
    </form>

  </main>

</div>

</body>
</html>
