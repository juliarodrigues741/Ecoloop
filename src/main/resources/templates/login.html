<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Ecoloop</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card card">
      <h2>Entrar</h2>
      <p>Usuário e senha para acessar o painel</p>

      <form action="/login" method="post">

        <input class="input" name="username" placeholder="Usuário" required>
        <input class="input" name="password" type="password" placeholder="Senha" required>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
          <a href="#" style="font-size:13px;color:rgba(6,58,42,0.8)">Esqueceu a senha?</a>
          <button class="btn" type="submit">Entrar</button>
        </div>

      </form>

    </div>
  </div>
</body>
</html>
