<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enviar - Ecoloop</title>
<link rel="stylesheet" href="/styles.css"><script src="../js/scripts.js" defer></script></head>
<body>
  <div class="app">
    
<nav class="sidebar">
  <div class="brand">
    <div class="logo">E</div>
    <h1>Ecoloop</h1>
  </div>
  <div class="menu">
      <a href="/dashboard">Home</a>
      <a href="/enviar">Enviar</a>
      <a href="/beneficios">Benefícios</a>
      <a href="/conquistas">Conquistas</a>
      <a href="/perfil">Perfil</a>
      <a href="/configuracoes">Configurações</a>
      <a href="/uploads">Gerenciar Uploads</a>
      <a href="#">Sair</a>
    </div>
</nav>

    <main class="content">
      <h2>Enviar Material para Reciclagem</h2>
      <div class="card">
        <div class="dropzone">
          <form action="/upload" method="post">
            <p><strong>Arraste sua Foto ou Vídeo Aqui</strong></p>
            <input type="file" name="file" accept="image/*,video/*">
            <p id="file-info" style="margin-top:10px;font-size:13px;color:var(--muted)">Nenhum arquivo selecionado</p>
            <div style="margin-top:12px;display:flex;gap:8px">
              <button class="btn" type="submit">Enviar e Ganhar Pontos</button>
              <button class="btn-outline" type="button">Gerar Vídeo</button>
            </div>
          </form>
        </div>
        <div style="margin-top:12px">
          <label>Descreva os Materiais</label>
          <input class="input" placeholder="Ex: Garrafa PET, Vidro...">
        </div>
      </div>
    </main>
  </div>
</body>
</html>
