<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoLoop - Enviar Material</title>

    <link rel="stylesheet" th:href="@{/enviar.css}">
</head>
<body>

<div class="container">

    <aside class="sidebar">  
		<div class="logo-row">  
		    <img src="https://www.pngegg.com/pngimages/838/936/png-clipart-recycling-symbol-recycling-bin-waste-paper-waste-glass-recycle-angle-logo.png" 
		         class="logo-circle">
		    <span class="logo-text">EcoLoop</span>  
		</div>
  
      <nav class="nav">  
        <button class="nav-item"><a href="/dashboard" class="menu-item">Home</a></button>
        <button class="nav-item active"><a href="/enviar" class="menu-item">Enviar</a></button>
        <button class="nav-item"><a href="/beneficios" class="menu-item">Benefícios</a></button>
        <button class="nav-item"><a href="/conquistas" class="menu-item">Conquistas</a></button>
        <button class="nav-item"><a href="/perfil" class="menu-item">Perfil</a></button>
        <button class="nav-item"><a href="/configuracoes" class="menu-item">Configurações</a></button>
        <button class="nav-item"><a href="/uploads" class="menu-item">Uploads</a></button>  
      </nav>

      <button class="nav-item"><a href="/login" class="menu-item">Sair</a></button>
    </aside>

    <main class="content">

        <h1>Enviar Material</h1>
        <p class="subtitle">Envie fotos ou vídeos dos seus materiais recicláveis</p>

        <!--ALERTAS DE ERRO E SUCESSO -->
        <div th:if="${mensagemSucesso}" class="alert alert_success">
            <p th:text="${mensagemSucesso}"></p>
        </div>

        <div th:if="${mensagemErro}" class="alert alert_error">
            <p th:text="${mensagemErro}"></p>
        </div>
        <!--FIM DOS ALERTAS -->


        <!-- Form para envio -->
        <form action="/enviar" method="post" enctype="multipart/form-data">

            <section class="uploadBox">

                <div class="upload-area">
                    <div class="upload-icon">⬆</div>
                    <span>Arraste suas fotos ou vídeos aqui</span>

                    <div class="upload-buttons">
                        <label class="camera-btn">
                            Tirar Foto
                            <input type="file" accept="image/*" capture="camera" name="files">
                        </label>

                        <label class="camera-btn">
                            Gravar Vídeo
                            <input type="file" accept="video/*" capture="camcorder" name="files">
                        </label>
                    </div>

                    <label class="fileInput">
                        <input type="file" name="files" multiple>
                        Escolher Arquivos
                    </label>
                </div>

                <div class="material-box">
                    <label>Tipo de Material</label>
                    <select name="material" required>
                        <option value="">Selecione o tipo</option>
                        <option value="Plástico">Plástico</option>
                        <option value="Papel">Papel</option>
                        <option value="Vidro">Vidro</option>
                        <option value="Metal">Metal</option>
                        <option value="Eletrônicos">Eletrônicos</option>
                    </select>

                    <label style="margin-top: 15px;">Peso (em Kg)</label>
                    <input type="number" 
                           name="pesoKg" 
                           step="0.01" 
                           min="0" 
                           placeholder="Ex: 1.25" 
                           required>

                    <ul class="tips">
                        <li>Tire fotos claras dos materiais</li>
                        <li>Separe por tipo de material</li>
                        <li>Vídeos podem ganhar pontos extras</li>
                        <li>Materiais limpos são melhor avaliados</li>
                    </ul>
                </div>
            </section>

            <section class="descriptionBox">
                <label>Descrição (Opcional)</label>
                <textarea name="descricao"
                    placeholder="Ex: 5 garrafas PET, 3 latas de alumínio…"></textarea>
            </section>

            <input type="hidden" name="usuarioId" th:value="${usuario.id}">

            <button class="send-btn" type="submit">Enviar Material</button>
        </form>

    </main>

</div>

</body>
</html>
