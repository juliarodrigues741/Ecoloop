<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uploads - Ecoloop</title>
<link rel="stylesheet" href="/styles.css"></head>
<body>
  
  <div class="app">
  
  <aside class="sidebar">  
      <div class="logo-row">  
        <div class="logo-circle"></div>  
        <span class="logo-text">EcoLoop</span>  
      </div>
  
      <nav class="nav">  
        <button class="nav-item">  
          <span ><a href="/dashboard" class="menu-item">Home</a></span> 
        </button>  
        <button class="nav-item">  
          <span ><a href="/enviar" class="menu-item">Enviar</a></span> 
        </button>  
        <button class="nav-item">  
          <span ><a href="/beneficios" class="menu-item">Benefícios</a></span>   
        </button>  
        <button class="nav-item">  
          <span ><a href="/conquistas" class="menu-item">Conquistas</a></span>  
        </button>  
        <button class="nav-item">  
          <span ><a href="/perfil" class="menu-item">Perfil</a></span>   
        </button>  
        <button class="nav-item">  
          <span ><a href="/configuracoes" class="menu-item">Configurações</a></span>   
        </button>  
        <button class="nav-item active">  
          <span ><a href="/uploads" class="menu-item">Uploads</a></span>   
        </button>  
      </nav>
  
      <button class="nav-item">
        <span ><a href="/login" class="menu-item">Sair</a></span> 
      </button>  
    </aside>

    <main class="content">
      <h2>Gerenciamento de uploads</h2>
	  <div class="card">
	      <div style="display:flex;flex-direction:column;gap:10px">

	          <th:block th:each="uploads : ${uploads}">
	              <div style="display:flex;justify-content:space-between;align-items:center">
	                  <div>
	                      <span th:text="${uploads.descricao}"></span> -
	                      <a th:href="${uploads.caminhoArquivo}" target="_blank">Abrir</a>
	                  </div>

	                  <div>
	                      <span th:text="${uploads.status}"></span>
	                  </div>
	              </div>
	          </th:block>

	      </div>
	  </div>

    </main>
  </div>
</body>
</html>
