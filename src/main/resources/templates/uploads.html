<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Uploads - Ecoloop</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="logo">E</div><h1>Ecoloop</h1></div>
      <nav class="menu">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/logout}">Sair</a>
      </nav>
    </aside>

    <main class="content">
      <div class="header-row"><h2>Uploads</h2></div>

      <div class="card">
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr style="text-align:left;color:var(--muted)">
              <th>ID</th>
              <th>Usuário</th>
              <th>Arquivo</th>
              <th>Descrição</th>
              <th>Data</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>

            <!-- LOOP CORRIGIDO -->
            <tr th:each="m : ${uploads}">
              <td th:text="${m.id}"></td>
              <td th:text="${m.usuarioId}"></td>
              <td><a th:href="@{${m.caminhoArquivo}}" target="_blank">Ver</a></td>
              <td th:text="${m.descricao}"></td>
              <td th:text="${#temporals.format(m.dataEnvio, 'dd/MM/yyyy HH:mm')}"></td>
              <td th:text="${m.status}"></td>
            </tr>

            <!-- MENSAGEM QUANDO VAZIO -->
            <tr th:if="${#lists.isEmpty(uploads)}">
              <td colspan="6">Nenhum envio pendente.</td>
            </tr>

          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
