<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Configurações - EcoLoop</title>
  <link rel="stylesheet" href="/configuracoes.css" />
</head>

<body>
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo-row">
        <div class="logo-circle"></div>
        <span class="logo-text">EcoLoop</span>
      </div>

      <nav class="nav">
        <button class="nav-item"><a th:href="@{/dashboard}" class="menu-item">Home</a></button>
        <button class="nav-item"><a th:href="@{/enviar}" class="menu-item">Enviar</a></button>
        <button class="nav-item"><a th:href="@{/beneficios}" class="menu-item">Benefícios</a></button>
        <button class="nav-item"><a th:href="@{/conquistas}" class="menu-item">Conquistas</a></button>
        <button class="nav-item"><a th:href="@{/perfil}" class="menu-item">Perfil</a></button>
        <button class="nav-item active"><a th:href="@{/configuracoes}" class="menu-item">Configurações</a></button>
        <button class="nav-item"><a th:href="@{/uploads}" class="menu-item">Uploads</a></button>
      </nav>

      <button class="nav-item">
        <a th:href="@{/login}" class="menu-item">Sair</a>
      </button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">

      <header class="page-header">
        <h1>Configurações</h1>
        <p>Gerencie suas preferências e conta</p>
      </header>
	  
	  <!-- MENSAGENS DE RETORNO -->
	  <div th:if="${param.sucesso}" class="alert success">
	    Configurações alteradas com sucesso!
	  </div>

	  <div th:if="${param.emailAlterado}" class="alert success">
	    Email alterado com sucesso!
	  </div>

	  <div th:if="${param.senhaAlterada}" class="alert success">
	    Senha alterada com sucesso!
	  </div>

	  <div th:if="${param.erroSenha}" class="alert error">
	    A senha atual está incorreta.
	  </div>

      <section class="settings-card">

        <header class="settings-header">
          <div class="settings-icon"></div>
          <span class="settings-title">Perfil</span>
        </header>

        <!-- ALTERAR EMAIL -->
        <form class="settings-form" th:action="@{/configuracoes/alterar-email}" method="post">

          <div class="form-group">
            <label for="username">Nome de usuário</label>
            <input id="username" type="text" th:value="${usuario.nome}" readonly />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" name="novoEmail" th:value="${usuario.email}" required />
          </div>

          <div class="form-footer">
            <button type="submit" class="btn-save">Alterar Email</button>
          </div>

        </form>

        <hr />

        <!-- ALTERAR SENHA -->
        <form class="settings-form" th:action="@{/configuracoes/alterar-senha}" method="post">

          <div class="form-group">
            <label for="senhaAtual">Senha atual</label>
            <input id="senhaAtual" type="password" name="senhaAtual" required />
          </div>

          <div class="form-group">
            <label for="novaSenha">Nova senha</label>
            <input id="novaSenha" type="password" name="novaSenha" required />
          </div>

          <div class="form-footer">
            <button type="submit" class="btn-save">Alterar Senha</button>
          </div>

        </form>

        <hr />

        <!-- PREFERÊNCIAS DO USUÁRIO -->
        <form class="settings-form" th:action="@{/configuracoes}" method="post">

          <div class="form-group">
            <label for="idioma">Idioma</label>
            <select id="idioma" name="idioma">
              <option value="pt" th:selected="${config.idioma == 'pt'}">Português</option>
              <option value="en" th:selected="${config.idioma == 'en'}">Inglês</option>
              <option value="es" th:selected="${config.idioma == 'es'}">Espanhol</option>
            </select>
          </div>

          <div class="form-group">
            <label>
              <input type="checkbox" name="temaEscuro" th:checked="${config.temaEscuro}" />
              Tema escuro
            </label>
          </div>

          <div class="form-group">
            <label>
              <input type="checkbox" name="notificacaoEmail" th:checked="${config.notificacaoEmail}" />
              Receber notificações por email
            </label>
          </div>

          <div class="form-footer">
            <button type="submit" class="btn-save">Salvar Preferências</button>
          </div>

        </form>

      </section>

    </main>

  </div>
</body>
</html>
