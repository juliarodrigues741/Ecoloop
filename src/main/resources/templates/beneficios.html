<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Benefícios - Ecoloop</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="logo">E</div><h1>Ecoloop</h1></div>
      <nav class="menu">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a class="active" th:href="@{/beneficios}">Benefícios</a>
        <a th:href="@{/conquistas}">Conquistas</a>
        <a th:href="@{/enviar}">Enviar</a>
        <a th:href="@{/perfil}">Perfil</a>
        <a th:href="@{/logout}">Sair</a>
      </nav>
    </aside>

    <main class="content">

      <!-- 🔵 INFORMAÇÕES DO USUÁRIO -->
      <div class="card" style="margin-bottom: 20px;">
        <h3>Seus Pontos</h3>
		<p>Seus pontos: <strong th:text="${usuario.pontos}"></strong></p>
		<p>Seu nível: <strong th:text="${usuario.nivel}"></strong></p>
      </div>

	  <div class="header-row">
		<h2>Benefícios Disponíveis</h2>

		<div class="grid-3">
		  <div th:each="b : ${disponiveis}" class="card">
		    <h3 th:text="${b.nome}"></h3>
		    <p th:text="${b.descricao}"></p>
		    <p><strong>Pontos:</strong> <span th:text="${b.pontosNecessarios}"></span></p>

		    <a class="btn"
		       th:href="@{'/beneficios/resgatar/' + ${b.id}}"
		       th:if="${usuario.pontos >= b.pontosNecessarios}">
		       Resgatar
		    </a>

		    <button class="btn-outline" disabled
		       th:if="${usuario.pontos < b.pontosNecessarios}">
		       Pontos insuficientes
		    </button>
		  </div>
		</div>

		<hr>

		<h2>Benefícios Resgatados</h2>

		<div class="grid-3">
		  <div th:each="b : ${resgatados}" class="card resgatado">
		    <h3 th:text="${b.nome}"></h3>
		    <p th:text="${b.descricao}"></p>
		    <p><strong>Pontos gastos:</strong> <span th:text="${b.pontosNecessarios}"></span></p>
		    <span class="badge">Resgatado</span>
		  </div>
		</div>

		<div th:if="${#lists.isEmpty(resgatados)}" class="card">
		  Você ainda não resgatou nenhum benefício.
		</div>

	  </div>
      </div>

      <div th:if="${#lists.isEmpty(beneficios)}" class="card">
        Nenhum benefício disponível.
      </div>

    </main>
  </div>
</body>
</html>
