<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Benefícios - Ecoloop</title>

    <!-- Caminho correto no Spring Boot -->
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="brand">
            <div class="logo">E</div>
            <h1>Ecoloop</h1>
        </div>

        <div class="menu">
            <a href="/dashboard">Home</a>
            <a href="/enviar">Enviar</a>
            <a href="/beneficios">Benefícios</a>
            <a href="/conquistas">Conquistas</a>
            <a href="/perfil">Perfil</a>
            <a href="/configuracoes">Configurações</a>
            <a href="/uploads">Gerenciar Uploads</a>
            <a href="/logout">Sair</a>
        </div>
    </nav>

    <!-- Conteúdo -->
    <main class="content">
        <h2>Benefícios</h2>

        <div class="card">

            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <h3>Total de Pontos</h3>
                    <div style="font-size:28px; font-weight:700;">
                        <!-- Exemplo de uso com Thymeleaf: -->
                        <!-- <span th:text="${usuario.pontos}"></span> -->
                        1250 pontos
                    </div>
                </div>

                <div>
                    <button class="btn">Resgatar</button>
                </div>
            </div>

            <div style="margin-top:12px" class="grid-4">
                <div class="card">Desconto em Loja A</div>
                <div class="card">Desconto em Loja B</div>
                <div class="card">Produto Sustentável 1</div>
                <div class="card">Produto Sustentável 2</div>
            </div>

        </div>
    </main>

</div>
</body>
</html>
