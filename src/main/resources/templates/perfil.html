<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Perfil - EcoLoop</title>
  <link rel="stylesheet" href="/perfil.css" />
</head>
<body>
  <div class="app">

    <!-- SIDEBAR -->
	<aside class="sidebar">  
	      <div class="logo-row">  
	        <div class="logo-circle"></div>  
	        <span class="logo-text">EcoLoop</span>  
	      </div>
	  
	      <nav class="nav">  
	        <button class="nav-item"><a href="/dashboard" class="menu-item">Home</a></button>
	        <button class="nav-item"><a href="/enviar" class="menu-item">Enviar</a></button>
	        <button class="nav-item"><a href="/beneficios" class="menu-item">Benefícios</a></button>
	        <button class="nav-item"><a href="/conquistas" class="menu-item">Conquistas</a></button>
	        <button class="nav-item active"><a href="/perfil" class="menu-item">Perfil</a></button>
	        <button class="nav-item"><a href="/configuracoes" class="menu-item">Configurações</a></button>
	        <button class="nav-item"><a href="/uploads" class="menu-item">Uploads</a></button>  
	      </nav>

	      <button class="nav-item"><a href="/login" class="menu-item">Sair</a></button>
	    </aside>

    <!-- CONTEÚDO -->
    <main class="main">
      <header class="main-header">
        <h1>Perfil</h1>
        <p>Gerencie suas informações e veja suas estatísticas</p>
      </header>

      <section class="content-grid">

        <!-- COLUNA ESQUERDA -->
        <div class="left-col">

          <!-- CARD PERFIL -->
          <div class="card profile-card">
            <div class="profile-top">

				<div class="avatar">  
				  <span th:text="${usuario.nome.substring(0,1)}">D</span>  
				  <div class="camera"></div>  
				</div>
				
              <div class="info">
                <div class="email-row">
                  <span class="email-main" th:text="${usuario.email}"></span>
                  <button class="edit-icon" onclick="location.href='/editar-perfil'"></button>
                </div>

                <p class="email-sec" th:text="${usuario.nome}">Nome usuário</p>

                <div class="badge-row">
                  <span class="badge level">Nível <span th:text="${usuario.nivel}">5</span></span>
                  <span class="badge eco">⭐ <span th:text="${usuario.conquistaPrincipal}">Eco Guerreiro</span></span>
                </div>

                <div class="progress-area">
                  <div class="progress-labels">
                    <span>Progresso para Nível 6</span>
                    <span th:text="${usuario.pontos + ' pts'}"></span>
                  </div>

                  <div class="progress-bar">
                    <div class="progress-fill" th:style="'width:' + ${usuario.pontos} + '%'"></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="profile-actions">
              <button class="btn primary" onclick="location.href='/configuracoes'">Editar Perfil</button>
              <button class="btn outline" onclick="location.href='/conquistas'">
                <span class="icon-medal"></span>
                Ver Conquistas
              </button>
            </div>
          </div>

          <!-- CARD ESTATÍSTICAS -->
          <div class="card stats-card">
            <h3>Estatísticas</h3>

            <div class="stat-item">
              <div class="stat-icon total"></div>
              <div class="stat-text">
                <span class="stat-label">Total Reciclado</span>
				<span class="stat-value" th:text="${totalKg + ' kg'}"></span>
              </div>
            </div>

            <div class="stat-item">
              <div class="stat-icon uploads"></div>
              <div class="stat-text">
                <span class="stat-label">Uploads Aprovados</span>
				<span class="stat-value" th:text="${totalUploadsAprovados}">0</span>
              </div>
            </div>

            <div class="stat-item">
              <div class="stat-icon co2"></div>
              <div class="stat-text">
                <span class="stat-label">CO₂ Economizado</span>
				<span class="stat-value" th:text="${co2Economizado + ' kg'}">0 kg</span>
              </div>
            </div>

            <div class="stat-item">
              <div class="stat-icon tree"></div>
              <div class="stat-text">
                <span class="stat-label">Árvores Salvas</span>
				<span class="stat-value" th:text="${arvoresSalvas}">0</span>
              </div>
            </div>
          </div>
        </div>

        <!-- COLUNA DIREITA -->
        <div class="right-col">

          <!-- ABAS -->
          <div class="tabs">
            <button class="tab"
                    th:classappend="${aba == 'reciclagens' ? 'active' : ''}"
                    onclick="location.href='/perfil?aba=reciclagens'">Reciclagens</button>

            <button class="tab"
                    th:classappend="${aba == 'resgates' ? 'active' : ''}"
                    onclick="location.href='/perfil?aba=resgates'">Resgates</button>
          </div>

          <!-- HISTÓRICO -->
          <div class="card history-card">
            <h3 th:text="${aba == 'reciclagens' ? 'Histórico de Reciclagens' : 'Histórico de Resgates'}"></h3>

            <div class="history-list">

              <!-- Aba Reciclagens -->
              <div th:if="${aba == 'reciclagens'}">
                <div th:each="m : ${reciclagens}" class="history-item">
                  <span th:text="${#temporals.format(m.dataEnvio, 'dd/MM/yyyy HH:mm')}"></span>
                  <span class="history-desc" th:text="${m.descricao}"></span>
                  <span class="history-points" th:text="${m.pontosGerados + ' pts'}"></span>
                </div>
                <div th:if="${#lists.isEmpty(reciclagens)}">Nenhuma reciclagem registrada.</div>
              </div>

              <!-- Aba Resgates (CORRIGIDO) -->
              <div th:if="${aba == 'resgates'}">
                <div th:each="b : ${resgates}" class="history-item">
                  <span th:text="${#temporals.format(b.dataResgate, 'dd/MM/yyyy HH:mm')}"></span>
                  <span class="history-desc" th:text="${b.nome}"></span>
                </div>
                <div th:if="${#lists.isEmpty(resgates)}">Nenhum resgate realizado.</div>
              </div>

            </div>
          </div>
        </div>

      </section>
    </main>
  </div>
</body>
</html>
