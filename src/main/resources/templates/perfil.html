<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Perfil - EcoLoop</title>
  <link rel="stylesheet" href="/admin-dashboard.css" />
  <style>
    .profile-section {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .profile-avatar-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2f9e44, #165c33);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
    }

    .profile-info h2 {
      font-size: 28px;
      color: #165c33;
      margin-bottom: 4px;
    }

    .profile-info p {
      color: #6b8576;
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #456757;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      border: 1px solid #e4efe7;
      background: #f8fcf8;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      color: #0f3d2b;
      outline: none;
    }

    .form-group input:focus {
      border-color: #2f9e44;
      box-shadow: 0 0 0 3px rgba(47, 158, 68, 0.1);
    }

    .btn-save {
      background: #2f9e44;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(47, 158, 68, 0.2);
    }

    .btn-save:hover {
      background: #27873a;
    }
  </style>
</head>
<body>
  <script>if (localStorage.getItem('tema') === 'escuro') document.body.classList.add('dark');</script>
  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo-row">
        <div class="logo-circle">
          <span style="font-size:22px">🌍</span>
        </div>
        <span class="logo-text">EcoLoop</span>
      </div>

      <p class="sidebar-section">MENU</p>

      <nav class="nav">
        <a href="/dashboard" class="nav-item">
          <span class="nav-icon">🏠</span> Home
        </a>
        <a href="/enviar" class="nav-item">
          <span class="nav-icon">📸</span> Enviar
        </a>
        <a href="/beneficios" class="nav-item">
          <span class="nav-icon">🎁</span> Benefícios
        </a>
        <a href="/conquistas" class="nav-item">
          <span class="nav-icon">🏆</span> Conquistas
        </a>
        <a href="/perfil" class="nav-item active">
          <span class="nav-icon">👤</span> Perfil
        </a>
        <a href="/configuracoes" class="nav-item">
          <span class="nav-icon">⚙️</span> Configurações
        </a>
      </nav>

      <a href="/logout" class="nav-item sair-btn">
        <span class="nav-icon">🚪</span> Sair
      </a>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main">

      <div class="top-bar">
        <div>
          <h1 class="page-title">Meu Perfil</h1>
          <p class="page-sub">Gerencie suas informações pessoais</p>
        </div>
        <div class="admin-badge">
          <div class="admin-avatar">U</div>
          <span>Usuário</span>
        </div>
      </div>

      <!-- CARDS DE RESUMO -->
      <section class="cards-row">
        <article class="stat-card green">
          <div class="stat-icon">⭐</div>
          <div>
            <p class="stat-label">Pontos Totais</p>
            <p class="stat-value">1250</p>
          </div>
        </article>
        <article class="stat-card pink">
          <div class="stat-icon">🏆</div>
          <div>
            <p class="stat-label">Conquistas</p>
            <p class="stat-value">12</p>
          </div>
        </article>
        <article class="stat-card blue">
          <div class="stat-icon">📊</div>
          <div>
            <p class="stat-label">Nível</p>
            <p class="stat-value">5</p>
          </div>
        </article>
      </section>

      <!-- PERFIL -->
      <div class="profile-section">
        <div class="profile-header">
          <div class="profile-avatar-large">U</div>
          <div class="profile-info">
            <h2>Usuário EcoLoop</h2>
            <p>Membro desde Março 2024</p>
          </div>
        </div>

        <form>
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:18px">
            <div class="form-group">
              <label>Nome Completo</label>
              <input type="text" placeholder="Digite seu nome" />
            </div>

            <div class="form-group">
              <label>E-mail</label>
              <input type="email" placeholder="seu@email.com" />
            </div>

            <div class="form-group">
              <label>Telefone</label>
              <input type="tel" placeholder="(00) 00000-0000" />
            </div>

            <div class="form-group">
              <label>CPF</label>
              <input type="text" placeholder="000.000.000-00" />
            </div>
          </div>

          <div class="form-group">
            <label>Endereço</label>
            <input type="text" placeholder="Rua, número, bairro" />
          </div>

          <button type="submit" class="btn-save">
            Salvar Alterações
          </button>
        </form>
      </div>

    </main>
  </div>
</body>
</html>
