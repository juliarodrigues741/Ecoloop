<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Meu Perfil - Ecoloop</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="logo">E</div><h1>Ecoloop</h1></div>
      <nav class="menu">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/beneficios}">Benefícios</a>
        <a th:href="@{/conquistas}">Conquistas</a>
        <a th:href="@{/enviar}">Enviar</a>
        <a th:href="@{/perfil}">Perfil</a>
        <a th:href="@{/logout}">Sair</a>
      </nav>
    </aside>

    <main class="content">
      <div class="header-row">
        <h2>Meu Perfil</h2>
        <div class="chips">
          <div class="chip">Nível: <strong th:text="${usuario.nivel}">Bronze</strong></div>
          <div class="chip">Pontos: <strong th:text="${usuario.pontos}">0</strong></div>
        </div>
      </div>

      <div class="card profile-row">
        <div class="avatar" th:if="${usuario.fotoPerfil == null}"> <span th:text="${usuario.nome.substring(0,1)}">U</span> </div>
        <img th:if="${usuario.fotoPerfil != null}" th:src="${usuario.fotoPerfil}" alt="foto" style="width:72px;height:72px;border-radius:50%"/>

        <div>
          <p><strong th:text="${usuario.nome}">Nome</strong></p>
          <p th:text="${usuario.email}">email@exemplo.com</p>
          <p>Cadastrado: <span th:text="${#temporals.format(usuario.dataCadastro, 'dd/MM/yyyy')}"></span></p>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
